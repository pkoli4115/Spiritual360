plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // id 'com.google.firebase.firebase-perf'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.22'
}

android {
    namespace 'com.hindu.pooja'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.hindu.pooja"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 6
        versionName "1.5"
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // ✅ add this line
            buildConfigField "boolean", "DEV_ONLY", "false"
        }
        debug {
            debuggable true

            // ✅ add this line
            buildConfigField "boolean", "DEV_ONLY", "true"
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    buildFeatures {
        compose true
        buildConfig true   // ✅ make sure this is present
    }

    // ✅ Keep compiler at 1.5.10 to match Kotlin 1.9.22
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.10"
    }

    packagingOptions {
        resources { excludes += ["/META-INF/{AL2.0,LGPL2.1}"] }
    }
}

dependencies {
    // ===== Compose (BOM keeps versions aligned) =====
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'        // keep single entry (no explicit version)
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'          // tooling only in debug

    // ===== Activity & Navigation (single versions) =====
    implementation 'androidx.activity:activity-compose:1.8.2'    // keep 1.8.2 (remove 1.9.2)
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // ⭐ Splash API (needed for installSplashScreen)
    implementation "androidx.core:core-splashscreen:1.0.1"

    // ===== Lifecycle =====
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // ===== Hilt ZXing + Firebase KTX coroutines=====
    implementation 'com.google.dagger:hilt-android:2.50'
    kapt 'com.google.dagger:hilt-compiler:2.50'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'
    implementation "com.google.zxing:core:3.5.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
    implementation platform("com.google.firebase:firebase-bom:33.1.2")
    implementation "com.google.firebase:firebase-firestore-ktx"
    implementation "com.google.firebase:firebase-storage-ktx"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.12.0"

    // ===== WorkManager =====
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // ===== Room =====
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.12.0"

    // ===== DataStore =====
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    implementation "com.google.firebase:firebase-storage-ktx:21.0.1"   // or latest

    // ===== Firebase (BOM) =====
    implementation platform('com.google.firebase:firebase-bom:33.3.0')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'

    // App Check (Play Integrity in prod, Debug in debug builds)
    implementation "com.google.firebase:firebase-appcheck-playintegrity:17.1.1"
    debugImplementation "com.google.firebase:firebase-appcheck-debug:17.1.1"

    // ===== Sign-in =====
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.facebook.android:facebook-android-sdk:latest.release'

    // ===== Images (Coil) =====
    implementation "io.coil-kt:coil-compose:2.6.0"
    implementation "io.coil-kt:coil-gif:2.6.0"

    // ===== JSON / Coroutines =====
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // ===== Optional utilities =====
    implementation "com.google.accompanist:accompanist-flowlayout:0.30.1"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ===== Optional security =====
    implementation 'androidx.security:security-crypto:1.1.0-alpha03'
}

apply plugin: 'com.google.gms.google-services'
