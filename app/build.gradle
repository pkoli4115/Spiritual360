plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.22'
}

android {
    namespace 'com.hindu.pooja'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.hindu.pooja"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.10"
    }

    packagingOptions {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    // --- Compose Core & Material3 ---
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation "androidx.compose.foundation:foundation"
    implementation 'androidx.compose.ui:ui-tooling'

    // --- Firebase ---
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-perf-ktx'

    // --- Google Sign-In ---
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // --- Hilt DI ---
    implementation 'com.google.dagger:hilt-android:2.50'
    kapt 'com.google.dagger:hilt-compiler:2.50'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'

    // --- Navigation ---
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // --- ViewModel + Lifecycle ---
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // --- Coil (image loading) ---
    implementation("io.coil-kt:coil-compose:2.4.0")

    // --- Coroutines/Flow ---
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // --- DataStore (optional, for XP saving etc) ---
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // --- Security (optional, for encrypted prefs) ---
    implementation 'androidx.security:security-crypto:1.1.0-alpha03'

    // --- Accompanist (for flow layouts etc) ---
    implementation "com.google.accompanist:accompanist-flowlayout:0.30.1"

    // --- Gson (optional) ---
    implementation 'com.google.code.gson:gson:2.10.1'

    // --- Kotlin Serialization (optional, for API/JSON parsing) ---
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // --- OkHttp (for country/state API if used) ---
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
}

apply plugin: 'com.google.gms.google-services'
