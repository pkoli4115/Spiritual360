plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.hindu.pooja'
    compileSdkVersion 35

    // Build info
    def buildTime = new Date().format("yyyy-MM-dd HH:mm:ss")
    def gitSha = "unknown"
    try {
        def p = "git rev-parse --short HEAD".execute(null, rootDir)
        p.waitFor()
        if (p.exitValue() == 0) gitSha = p.text.trim()
    } catch(ignored) {}

    defaultConfig {
        applicationId "com.hindu.pooja"
        minSdkVersion 24
        targetSdkVersion 35

        // 🔼 Bumped for new upload
        versionCode 26
        versionName "2.6"

        vectorDrawables.useSupportLibrary = true

        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
        buildConfigField "String", "GIT_SHA", "\"${gitSha}\""
        buildConfigField "long", "BUILD_ID", "${System.currentTimeMillis()}L"
    }

    signingConfigs {
        debug {
            storeFile file(DEBUG_STORE_FILE)
            storePassword DEBUG_STORE_PASSWORD
            keyAlias DEBUG_KEY_ALIAS
            keyPassword DEBUG_KEY_PASSWORD
        }
        release {
            storeFile file(RELEASE_STORE_FILE)
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug

            debuggable true
            minifyEnabled false
            shrinkResources false

            buildConfigField "boolean", "DEV_ONLY", "true"
            buildConfigField "String", "BUILD_TYPE", "\"debug\""
        }

        release {
            signingConfig signingConfigs.release

            debuggable false
            minifyEnabled false  // TEMP while image issue debugging
            shrinkResources false

            buildConfigField "boolean", "DEV_ONLY", "false"
            buildConfigField "String", "BUILD_TYPE", "\"release\""

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.10"
    }

    packagingOptions {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
        // ✅ Important for targetSdk 35 + native libs + 16KB page-size rule
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation "androidx.core:core-splashscreen:1.0.1"

    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"

    implementation 'com.google.dagger:hilt-android:2.50'
    kapt 'com.google.dagger:hilt-compiler:2.50'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'

    implementation platform("com.google.firebase:firebase-bom:33.1.2")
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'

    implementation "com.google.firebase:firebase-appcheck:17.1.1"
    implementation "com.google.firebase:firebase-appcheck-playintegrity:17.1.1"
    debugImplementation "com.google.firebase:firebase-appcheck-debug:17.1.1"
    releaseImplementation "com.google.firebase:firebase-appcheck-playintegrity:17.1.2"

    implementation "com.google.android.play:app-update-ktx:2.1.0"
    implementation "com.google.android.play:app-update:2.1.0" // (optional KTX already wraps most)

    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.12.0"

    implementation "androidx.work:work-runtime-ktx:2.9.0"

    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    implementation "androidx.datastore:datastore-preferences:1.1.1"

    implementation "com.google.zxing:core:3.5.3"

    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.facebook.android:facebook-android-sdk:latest.release'

    implementation "io.coil-kt:coil-compose:2.6.0"
    implementation "io.coil-kt:coil-gif:2.6.0"

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    implementation "com.google.accompanist:accompanist-flowlayout:0.30.1"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'androidx.security:security-crypto:1.1.0-alpha03'
}

apply plugin: 'com.google.gms.google-services'
